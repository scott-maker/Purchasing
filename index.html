<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurify SaaS - Advanced Procurement</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5', // Indigo 600
                        secondary: '#1e293b', // Slate 800
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444'
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React 18 & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Recharts -->
    <script src="https://unpkg.com/prop-types@15.7.2/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>

    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, createContext, useContext } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, LineChart, Line } = window.Recharts;

        // --- SEED DATA ---
        const seedVendors = [
            { id: 'v1', name: 'Acme Corp', category: 'Hardware', contact: 'john@acme.com', terms: 'Net 30', score: 92 },
            { id: 'v2', name: 'Global Tech', category: 'Software', contact: 'sarah@global.com', terms: 'Net 60', score: 85 },
            { id: 'v3', name: 'FastLogistics', category: 'Shipping', contact: 'mike@fast.com', terms: 'Net 15', score: 98 }
        ];

        const seedCatalog = [
            { id: 'c1', sku: 'HW-SRV-01', name: 'Server Racks', category: 'Hardware', stdPrice: 1200 },
            { id: 'c2', sku: 'SW-CLD-99', name: 'Cloud Subscriptions', category: 'Software', stdPrice: 5000 },
            { id: 'c3', sku: 'OF-CHR-12', name: 'Office Chairs', category: 'Furniture', stdPrice: 200 },
            { id: 'c4', sku: 'IT-LPT-05', name: 'Laptops (ThinkPad)', category: 'IT Equip', stdPrice: 950 }
        ];

        const seedPOs = [
            { id: 'PO-1001', vendorId: 'v1', vendorName: 'Acme Corp', itemName: 'Server Racks', qty: 5, receivedQty: 0, price: 1200, total: 6000, status: 'ISSUED', paymentStatus: 'UNPAID', date: '2023-10-01' },
            { id: 'PO-1002', vendorId: 'v2', vendorName: 'Global Tech', itemName: 'Cloud Subscriptions', qty: 1, receivedQty: 1, price: 5000, total: 5000, status: 'FULFILLED', paymentStatus: 'PAID', date: '2023-10-15' },
            { id: 'PO-1003', vendorId: 'v3', vendorName: 'FastLogistics', itemName: 'Freight Q3', qty: 10, receivedQty: 4, price: 150, total: 1500, status: 'PARTIAL RECEIPT', paymentStatus: 'UNPAID', date: '2023-09-20' }
        ];

        const seedBids = [
            { id: 'b1', itemName: 'Laptops (ThinkPad)', vendorId: 'v1', vendorName: 'Acme Corp', amount: 950, status: 'PENDING' },
            { id: 'b2', itemName: 'Laptops (ThinkPad)', vendorId: 'v2', vendorName: 'Global Tech', amount: 890, status: 'PENDING' },
            { id: 'b3', itemName: 'Office Chairs', vendorId: 'v1', vendorName: 'Acme Corp', amount: 200, status: 'PENDING' }
        ];

        // --- CUSTOM HOOKS ---
        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) { return initialValue; }
            });
            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) { console.error(error); }
            };
            return [storedValue, setValue];
        }

        const generateId = (prefix) => `${prefix}-${Math.floor(Math.random() * 10000)}`;
        const exportCSV = (data, filename) => {
            if (!data || !data.length) return;
            const keys = Object.keys(data[0]);
            const csvContent = "data:text/csv;charset=utf-8," + keys.join(",") + "\n" + data.map(row => keys.map(k => `"${row[k]}"`).join(",")).join("\n");
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // --- TOAST CONTEXT ---
        const ToastContext = createContext();
        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = useState([]);
            const addToast = (message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
            };
            return (
                <ToastContext.Provider value={{ addToast }}>
                    {children}
                    <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2">
                        {toasts.map(t => (
                            <div key={t.id} className={`fade-in px-4 py-3 rounded-lg shadow-lg text-white flex items-center gap-3 ${t.type === 'success' ? 'bg-green-600' : 'bg-blue-600'}`}>
                                <i className={`fa-solid ${t.type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}`}></i>
                                <span>{t.message}</span>
                            </div>
                        ))}
                    </div>
                </ToastContext.Provider>
            );
        };
        const useToast = () => useContext(ToastContext);

        // --- UI COMPONENTS ---
        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 z-40 flex justify-center items-center fade-in">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden">
                        <div className="px-6 py-4 border-b flex justify-between items-center bg-gray-50">
                            <h3 className="font-semibold text-lg text-gray-800">{title}</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><i className="fa-solid fa-times"></i></button>
                        </div>
                        <div className="p-6 max-h-[80vh] overflow-y-auto">{children}</div>
                    </div>
                </div>
            );
        };

        const StatusBadge = ({ status }) => {
            const styles = {
                'ISSUED': 'bg-yellow-100 text-yellow-800 border-yellow-200',
                'PARTIAL RECEIPT': 'bg-blue-100 text-blue-800 border-blue-200',
                'FULFILLED': 'bg-green-100 text-green-800 border-green-200',
                'PENDING': 'bg-gray-100 text-gray-800 border-gray-200',
                'AWARDED': 'bg-primary bg-opacity-10 text-primary border-primary border-opacity-20',
                'PAID': 'bg-emerald-100 text-emerald-800 border-emerald-200',
                'UNPAID': 'bg-rose-100 text-rose-800 border-rose-200'
            };
            return (
                <span className={`px-2.5 py-1 text-xs font-semibold rounded-full border ${styles[status] || 'bg-gray-100'}`}>
                    {status}
                </span>
            );
        };

        // --- VIEWS ---

        const DashboardView = ({ pos, vendors }) => {
            const totalSpend = pos.reduce((sum, po) => sum + po.total, 0);
            const activePOs = pos.filter(p => p.status !== 'FULFILLED').length;
            const BUDGET_QUARTER = 150000;
            const budgetUsedPerc = Math.min((totalSpend / BUDGET_QUARTER) * 100, 100).toFixed(1);
            
            const spendByVendorMap = pos.reduce((acc, po) => {
                acc[po.vendorName] = (acc[po.vendorName] || 0) + po.total;
                return acc;
            }, {});
            const barData = Object.keys(spendByVendorMap).map(k => ({ name: k, Spend: spendByVendorMap[k] }));

            // Mock timeline data based on PO dates
            const timelineData = [...pos].sort((a,b) => new Date(a.date) - new Date(b.date)).reduce((acc, po) => {
                const existing = acc.find(x => x.date === po.date);
                if(existing) existing.amount += po.total;
                else acc.push({ date: po.date, amount: po.total });
                return acc;
            }, []);

            return (
                <div className="fade-in space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Procurement Intelligence</h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div className="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
                            <p className="text-sm text-gray-500 font-medium mb-1">Total PO Spend</p>
                            <p className="text-2xl font-bold text-gray-900">${totalSpend.toLocaleString()}</p>
                        </div>
                        <div className="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
                            <p className="text-sm text-gray-500 font-medium mb-1">Budget Utilization (Q3)</p>
                            <p className="text-2xl font-bold text-gray-900">{budgetUsedPerc}%</p>
                            <div className="w-full bg-gray-200 rounded-full h-1.5 mt-2">
                                <div className={`h-1.5 rounded-full ${budgetUsedPerc > 90 ? 'bg-red-500' : 'bg-green-500'}`} style={{width: `${budgetUsedPerc}%`}}></div>
                            </div>
                        </div>
                        <div className="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
                            <p className="text-sm text-gray-500 font-medium mb-1">Active POs</p>
                            <p className="text-2xl font-bold text-gray-900">{activePOs}</p>
                        </div>
                        <div className="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
                            <p className="text-sm text-gray-500 font-medium mb-1">Active Vendors</p>
                            <p className="text-2xl font-bold text-gray-900">{vendors.length}</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                            <h3 className="text-sm font-semibold text-gray-800 mb-4">Spend Timeline</h3>
                            <div className="h-64">
                                <ResponsiveContainer width="100%" height="100%">
                                    <LineChart data={timelineData}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                        <XAxis dataKey="date" axisLine={false} tickLine={false} tick={{fontSize: 12}} />
                                        <YAxis axisLine={false} tickLine={false} tickFormatter={(v) => `$${v}`} tick={{fontSize: 12}} />
                                        <Tooltip formatter={(v) => `$${v.toLocaleString()}`} />
                                        <Line type="monotone" dataKey="amount" stroke="#4f46e5" strokeWidth={3} dot={{r: 4}} />
                                    </LineChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                            <h3 className="text-sm font-semibold text-gray-800 mb-4">Spend by Vendor</h3>
                            <div className="h-64">
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={barData}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                        <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fontSize: 12}} />
                                        <YAxis axisLine={false} tickLine={false} tickFormatter={(v) => `$${v}`} tick={{fontSize: 12}} />
                                        <Tooltip cursor={{fill: '#f8fafc'}} formatter={(v) => `$${v.toLocaleString()}`} />
                                        <Bar dataKey="Spend" fill="#10b981" radius={[4, 4, 0, 0]} />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const CatalogView = ({ catalog, setCatalog }) => {
            const { addToast } = useToast();
            const [searchTerm, setSearchTerm] = useState("");
            const [isModalOpen, setIsModalOpen] = useState(false);

            const filtered = catalog.filter(c => c.name.toLowerCase().includes(searchTerm.toLowerCase()) || c.sku.toLowerCase().includes(searchTerm.toLowerCase()));

            const handleAdd = (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                setCatalog([...catalog, { id: generateId('c'), sku: fd.get('sku'), name: fd.get('name'), category: fd.get('category'), stdPrice: parseFloat(fd.get('stdPrice')) }]);
                setIsModalOpen(false);
                addToast('Item added to catalog!');
            };

            return (
                <div className="fade-in space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-gray-800">Item Catalog</h2>
                        <button onClick={() => setIsModalOpen(true)} className="px-4 py-2 bg-primary rounded-lg text-sm font-medium text-white hover:bg-indigo-700 shadow-sm transition">
                            <i className="fa-solid fa-plus mr-2"></i> Add Item
                        </button>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="p-4 border-b border-gray-100 bg-gray-50">
                            <input type="text" placeholder="Search SKU or Name..." className="pl-4 pr-4 py-2 w-72 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                        </div>
                        <table className="w-full text-left text-sm">
                            <thead className="bg-gray-50 text-gray-700 border-b">
                                <tr>
                                    <th className="p-4">SKU</th>
                                    <th className="p-4">Item Name</th>
                                    <th className="p-4">Category</th>
                                    <th className="p-4">Standard Price</th>
                                </tr>
                            </thead>
                            <tbody>
                                {filtered.map(c => (
                                    <tr key={c.id} className="border-b border-gray-50 hover:bg-gray-50">
                                        <td className="p-4 font-mono text-xs text-gray-500">{c.sku}</td>
                                        <td className="p-4 font-medium">{c.name}</td>
                                        <td className="p-4">{c.category}</td>
                                        <td className="p-4">${c.stdPrice.toLocaleString()}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title="Add Catalog Item">
                        <form onSubmit={handleAdd} className="space-y-4">
                            <div><label className="block text-sm mb-1">SKU</label><input required name="sku" className="w-full border rounded-lg p-2" /></div>
                            <div><label className="block text-sm mb-1">Item Name</label><input required name="name" className="w-full border rounded-lg p-2" /></div>
                            <div><label className="block text-sm mb-1">Category</label><input required name="category" className="w-full border rounded-lg p-2" /></div>
                            <div><label className="block text-sm mb-1">Standard Price ($)</label><input required type="number" step="0.01" name="stdPrice" className="w-full border rounded-lg p-2" /></div>
                            <button type="submit" className="w-full bg-primary text-white py-2 rounded-lg font-medium">Save Item</button>
                        </form>
                    </Modal>
                </div>
            );
        };

        const VendorsView = ({ vendors, setVendors }) => {
            const [searchTerm, setSearchTerm] = useState("");
            return (
                <div className="fade-in space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">Vendor Directory</h2>
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="p-4 border-b bg-gray-50"><input type="text" placeholder="Search vendors..." className="px-4 py-2 w-72 border rounded-lg text-sm" onChange={(e) => setSearchTerm(e.target.value)} /></div>
                        <table className="w-full text-left text-sm">
                            <thead className="bg-gray-50 text-gray-700 border-b">
                                <tr><th className="p-4">Vendor</th><th className="p-4">Category</th><th className="p-4">Contact</th><th className="p-4">Score</th></tr>
                            </thead>
                            <tbody>
                                {vendors.filter(v => v.name.toLowerCase().includes(searchTerm.toLowerCase())).map(v => (
                                    <tr key={v.id} className="border-b hover:bg-gray-50">
                                        <td className="p-4 font-medium">{v.name}</td>
                                        <td className="p-4">{v.category}</td>
                                        <td className="p-4">{v.contact}</td>
                                        <td className="p-4"><span className={`px-2 py-1 rounded text-xs font-bold ${v.score >= 90 ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}`}>{v.score}/100</span></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const POsView = ({ pos, setPOs, vendors, catalog }) => {
            const { addToast } = useToast();
            const [searchTerm, setSearchTerm] = useState("");
            const [createModal, setCreateModal] = useState(false);
            const [receivePO, setReceivePO] = useState(null); // Holds PO object being received
            
            const filteredPOs = pos.filter(p => p.id.toLowerCase().includes(searchTerm.toLowerCase()) || p.vendorName.toLowerCase().includes(searchTerm.toLowerCase()));

            const handleCreatePO = (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const vendorId = fd.get('vendorId');
                const vendor = vendors.find(v => v.id === vendorId);
                const itemName = fd.get('itemName');
                const qty = parseInt(fd.get('qty'));
                const price = parseFloat(fd.get('price'));
                
                const newPO = {
                    id: generateId('PO'),
                    vendorId: vendor.id, vendorName: vendor.name,
                    itemName, qty, receivedQty: 0, price, total: qty * price,
                    status: 'ISSUED', paymentStatus: 'UNPAID',
                    date: new Date().toISOString().split('T')[0]
                };
                setPOs([newPO, ...pos]);
                setCreateModal(false);
                addToast(`PO ${newPO.id} successfully created!`);
            };

            const handleReceive = (e) => {
                e.preventDefault();
                const amount = parseInt(new FormData(e.target).get('amount'));
                
                setPOs(pos.map(p => {
                    if(p.id !== receivePO.id) return p;
                    const newReceived = p.receivedQty + amount;
                    const newStatus = newReceived >= p.qty ? 'FULFILLED' : 'PARTIAL RECEIPT';
                    return { ...p, receivedQty: newReceived, status: newStatus };
                }));
                
                setReceivePO(null);
                addToast(`Successfully received ${amount} units for ${receivePO.id}`);
            };

            const handlePay = (poId) => {
                setPOs(pos.map(p => p.id === poId ? { ...p, paymentStatus: 'PAID' } : p));
                addToast(`PO ${poId} marked as PAID.`);
            };

            return (
                <div className="fade-in space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-gray-800">Purchase Orders & Receiving</h2>
                        <div className="flex gap-3">
                            <button onClick={() => exportCSV(pos, 'pos.csv')} className="px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50 shadow-sm"><i className="fa-solid fa-download mr-2"></i> Export</button>
                            <button onClick={() => setCreateModal(true)} className="px-4 py-2 bg-primary rounded-lg text-sm font-medium text-white hover:bg-indigo-700 shadow-sm"><i className="fa-solid fa-file-invoice mr-2"></i> Create PO</button>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="p-4 border-b bg-gray-50">
                            <input type="text" placeholder="Search POs..." className="px-4 py-2 w-72 border rounded-lg text-sm" onChange={(e) => setSearchTerm(e.target.value)} />
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-gray-50 text-gray-700 border-b">
                                    <tr>
                                        <th className="p-4">PO #</th>
                                        <th className="p-4">Vendor</th>
                                        <th className="p-4">Item</th>
                                        <th className="p-4">Qty (Recv / Ord)</th>
                                        <th className="p-4">Total</th>
                                        <th className="p-4">Status</th>
                                        <th className="p-4">Payment</th>
                                        <th className="p-4 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredPOs.map((p) => (
                                        <tr key={p.id} className="border-b hover:bg-gray-50">
                                            <td className="p-4 font-bold text-gray-900">{p.id}</td>
                                            <td className="p-4 font-medium">{p.vendorName}</td>
                                            <td className="p-4">{p.itemName}</td>
                                            <td className="p-4">
                                                <div className="flex items-center gap-2">
                                                    <div className="w-16 bg-gray-200 rounded-full h-1.5"><div className="bg-blue-500 h-1.5 rounded-full" style={{width: `${(p.receivedQty/p.qty)*100}%`}}></div></div>
                                                    <span className="text-xs text-gray-500">{p.receivedQty} / {p.qty}</span>
                                                </div>
                                            </td>
                                            <td className="p-4">${p.total.toLocaleString()}</td>
                                            <td className="p-4"><StatusBadge status={p.status} /></td>
                                            <td className="p-4"><StatusBadge status={p.paymentStatus} /></td>
                                            <td className="p-4 text-right space-x-2">
                                                {p.status !== 'FULFILLED' && (
                                                    <button onClick={() => setReceivePO(p)} className="px-3 py-1 bg-blue-50 text-blue-700 border border-blue-200 rounded text-xs font-semibold hover:bg-blue-100 transition">Receive</button>
                                                )}
                                                {p.status === 'FULFILLED' && p.paymentStatus === 'UNPAID' && (
                                                    <button onClick={() => handlePay(p.id)} className="px-3 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded text-xs font-semibold hover:bg-emerald-100 transition">Pay Inv</button>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* CREATE PO MODAL */}
                    <Modal isOpen={createModal} onClose={() => setCreateModal(false)} title="Draft New Purchase Order">
                        <form onSubmit={handleCreatePO} className="space-y-4">
                            <div>
                                <label className="block text-sm mb-1">Select Vendor</label>
                                <select required name="vendorId" className="w-full border rounded-lg p-2">
                                    <option value="">-- Choose Vendor --</option>
                                    {vendors.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm mb-1">Item Description</label>
                                <input required list="catalog-items" name="itemName" className="w-full border rounded-lg p-2" placeholder="Type or select from catalog" />
                                <datalist id="catalog-items">
                                    {catalog.map(c => <option key={c.id} value={c.name} />)}
                                </datalist>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-sm mb-1">Quantity</label><input required type="number" name="qty" min="1" className="w-full border rounded-lg p-2" /></div>
                                <div><label className="block text-sm mb-1">Unit Price ($)</label><input required type="number" step="0.01" name="price" className="w-full border rounded-lg p-2" /></div>
                            </div>
                            <button type="submit" className="w-full bg-primary text-white py-2 rounded-lg font-medium mt-4">Issue PO</button>
                        </form>
                    </Modal>

                    {/* RECEIVE ITEMS MODAL */}
                    <Modal isOpen={!!receivePO} onClose={() => setReceivePO(null)} title={`Receive Items - ${receivePO?.id}`}>
                        {receivePO && (
                            <form onSubmit={handleReceive} className="space-y-4">
                                <div className="bg-gray-50 p-3 rounded border text-sm text-gray-700">
                                    <p><strong>Item:</strong> {receivePO.itemName}</p>
                                    <p><strong>Ordered:</strong> {receivePO.qty} | <strong>Already Received:</strong> {receivePO.receivedQty}</p>
                                    <p><strong>Pending:</strong> {receivePO.qty - receivePO.receivedQty}</p>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">Quantity Receiving Now</label>
                                    <input required type="number" name="amount" min="1" max={receivePO.qty - receivePO.receivedQty} defaultValue={receivePO.qty - receivePO.receivedQty} className="w-full border rounded-lg p-2 focus:ring-2 focus:ring-primary" />
                                    <p className="text-xs text-gray-400 mt-1">Cannot exceed remaining pending amount.</p>
                                </div>
                                <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700">Log Receipt</button>
                            </form>
                        )}
                    </Modal>
                </div>
            );
        };

        // --- MAIN APP LAYOUT ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [vendors, setVendors] = useLocalStorage('proc_vendors', seedVendors);
            const [catalog, setCatalog] = useLocalStorage('proc_catalog', seedCatalog);
            const [pos, setPOs] = useLocalStorage('proc_pos', seedPOs);

            const tabs = [
                { id: 'dashboard', label: 'Intelligence', icon: 'fa-chart-pie' },
                { id: 'pos', label: 'Orders & Receiving', icon: 'fa-file-invoice-dollar' },
                { id: 'catalog', label: 'Item Catalog', icon: 'fa-box-open' },
                { id: 'vendors', label: 'Vendor Directory', icon: 'fa-address-book' }
            ];

            return (
                <div className="flex h-screen overflow-hidden bg-slate-50">
                    <aside className="w-64 bg-secondary text-slate-300 flex flex-col shadow-xl z-10">
                        <div className="p-6 flex items-center gap-3 text-white font-bold text-xl tracking-wide border-b border-slate-700">
                            <div className="w-8 h-8 bg-primary rounded flex items-center justify-center"><i className="fa-solid fa-boxes-packing text-sm"></i></div>
                            Procurify
                        </div>
                        <nav className="flex-1 px-4 py-6 space-y-2">
                            {tabs.map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all ${activeTab === tab.id ? 'bg-primary text-white shadow-md' : 'hover:bg-slate-700 hover:text-white'}`}>
                                    <i className={`fa-solid ${tab.icon} w-5 text-center`}></i> {tab.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-slate-700 text-xs text-center text-slate-500">Procurify OS v2.0</div>
                    </aside>

                    <main className="flex-1 flex flex-col h-screen overflow-hidden">
                        <header className="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm z-0">
                            <div className="text-gray-500 text-sm">Workspace / <span className="font-semibold text-gray-800 capitalize">{activeTab.replace('-', ' ')}</span></div>
                            <div className="flex items-center gap-4">
                                <button className="text-gray-400 hover:text-gray-600 transition"><i className="fa-regular fa-bell text-lg"></i></button>
                                <div className="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 font-bold text-sm flex items-center justify-center">JD</div>
                            </div>
                        </header>
                        <div className="flex-1 overflow-y-auto p-8">
                            {activeTab === 'dashboard' && <DashboardView pos={pos} vendors={vendors} />}
                            {activeTab === 'pos' && <POsView pos={pos} setPOs={setPOs} vendors={vendors} catalog={catalog} />}
                            {activeTab === 'catalog' && <CatalogView catalog={catalog} setCatalog={setCatalog} />}
                            {activeTab === 'vendors' && <VendorsView vendors={vendors} setVendors={setVendors} />}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ToastProvider><App /></ToastProvider>);
    </script>
</body>
</html>
