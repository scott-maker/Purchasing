<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurify OS - Enterprise Procurement & Vendor Management</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1', // Indigo 500
                        secondary: '#0f172a', // Slate 900
                        surface: '#1e293b',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444'
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React 18 & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Recharts -->
    <script src="https://unpkg.com/prop-types@15.7.2/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>

    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: #f1f5f9; color: #334155; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.25s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, createContext, useContext } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, LineChart, Line } = window.Recharts;

        // --- SEED DATA ---
        const seedVendors = [
            { id: 'v1', name: 'Acme Corp', category: 'Hardware', contact: 'john@acme.com', terms: 'Net 30', score: 94 },
            { id: 'v2', name: 'Global Tech', category: 'Software', contact: 'sarah@global.com', terms: 'Net 60', score: 88 },
            { id: 'v3', name: 'FastLogistics', category: 'Shipping', contact: 'mike@fast.com', terms: 'Net 15', score: 96 }
        ];

        const seedCatalog = [
            { id: 'c1', sku: 'HW-SRV-01', name: 'Server Racks', category: 'Hardware', stdPrice: 1200 },
            { id: 'c2', sku: 'SW-CLD-99', name: 'Cloud Subscriptions', category: 'Software', stdPrice: 5000 },
            { id: 'c3', sku: 'OF-CHR-12', name: 'Office Chairs', category: 'Furniture', stdPrice: 200 },
            { id: 'c4', sku: 'IT-LPT-05', name: 'Laptops (ThinkPad)', category: 'IT Equip', stdPrice: 950 }
        ];

        const seedInventory = [
            { id: 'i1', sku: 'HW-SRV-01', name: 'Server Racks', stock: 3, minStock: 5, warehouse: 'WH-East' },
            { id: 'i2', sku: 'SW-CLD-99', name: 'Cloud Subscriptions', stock: 50, minStock: 10, warehouse: 'Cloud' },
            { id: 'i3', sku: 'OF-CHR-12', name: 'Office Chairs', stock: 8, minStock: 12, warehouse: 'WH-West' },
            { id: 'i4', sku: 'IT-LPT-05', name: 'Laptops (ThinkPad)', stock: 2, minStock: 10, warehouse: 'WH-Central' }
        ];

        const seedPOs = [
            { id: 'PO-1001', vendorId: 'v1', vendorName: 'Acme Corp', itemName: 'Server Racks', qty: 5, receivedQty: 0, price: 1200, total: 6000, status: 'PENDING APPROVAL', paymentStatus: 'UNPAID', date: '2026-06-01' },
            { id: 'PO-1002', vendorId: 'v2', vendorName: 'Global Tech', itemName: 'Cloud Subscriptions', qty: 1, receivedQty: 1, price: 5000, total: 5000, status: 'FULFILLED', paymentStatus: 'PAID', date: '2026-06-10', rated: true },
            { id: 'PO-1003', vendorId: 'v3', vendorName: 'FastLogistics', itemName: 'Freight Q3', qty: 10, receivedQty: 4, price: 150, total: 1500, status: 'PARTIAL RECEIPT', paymentStatus: 'UNPAID', date: '2026-06-12' }
        ];

        const seedBids = [
            { id: 'b1', itemName: 'Laptops (ThinkPad)', vendorId: 'v1', vendorName: 'Acme Corp', amount: 950, status: 'PENDING' },
            { id: 'b2', itemName: 'Laptops (ThinkPad)', vendorId: 'v2', vendorName: 'Global Tech', amount: 890, status: 'PENDING' },
            { id: 'b3', itemName: 'Office Chairs', vendorId: 'v1', vendorName: 'Acme Corp', amount: 200, status: 'PENDING' }
        ];

        // --- CUSTOM HOOKS ---
        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) { return initialValue; }
            });
            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) { console.error(error); }
            };
            return [storedValue, setValue];
        }

        const generateId = (prefix) => `${prefix}-${Math.floor(Math.random() * 10000)}`;
        const exportCSV = (data, filename) => {
            if (!data || !data.length) return;
            const keys = Object.keys(data[0]);
            const csvContent = "data:text/csv;charset=utf-8," + keys.join(",") + "\n" + data.map(row => keys.map(k => `"${row[k]}"`).join(",")).join("\n");
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // --- TOAST CONTEXT ---
        const ToastContext = createContext();
        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = useState([]);
            const addToast = (message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
            };
            return (
                <ToastContext.Provider value={{ addToast }}>
                    {children}
                    <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2">
                        {toasts.map(t => (
                            <div key={t.id} className={`fade-in px-4 py-3 rounded-xl shadow-xl text-white text-sm font-medium flex items-center gap-3 ${t.type === 'success' ? 'bg-emerald-600' : t.type === 'warning' ? 'bg-amber-600' : 'bg-indigo-600'}`}>
                                <i className={`fa-solid ${t.type === 'success' ? 'fa-circle-check text-emerald-200' : t.type === 'warning' ? 'fa-triangle-exclamation text-amber-200' : 'fa-circle-info text-indigo-200'}`}></i>
                                <span>{t.message}</span>
                            </div>
                        ))}
                    </div>
                </ToastContext.Provider>
            );
        };
        const useToast = () => useContext(ToastContext);

        // --- UI COMPONENTS ---
        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900 bg-opacity-60 backdrop-blur-xs z-50 flex justify-center items-center fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden border border-slate-100">
                        <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                            <h3 className="font-bold text-slate-800 text-base">{title}</h3>
                            <button onClick={onClose} className="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-200 transition"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                        <div className="p-6 max-h-[80vh] overflow-y-auto">{children}</div>
                    </div>
                </div>
            );
        };

        const StatusBadge = ({ status }) => {
            const styles = {
                'PENDING APPROVAL': 'bg-amber-50 text-amber-700 border-amber-200',
                'ISSUED': 'bg-blue-50 text-blue-700 border-blue-200',
                'PARTIAL RECEIPT': 'bg-indigo-50 text-indigo-700 border-indigo-200',
                'FULFILLED': 'bg-emerald-50 text-emerald-700 border-emerald-200',
                'PENDING': 'bg-slate-100 text-slate-700 border-slate-200',
                'AWARDED': 'bg-violet-50 text-violet-700 border-violet-200',
                'PAID': 'bg-teal-50 text-teal-700 border-teal-200',
                'UNPAID': 'bg-rose-50 text-rose-700 border-rose-200'
            };
            return (
                <span className={`px-3 py-1 text-xs font-semibold rounded-full border inline-flex items-center gap-1.5 ${styles[status] || 'bg-slate-100 text-slate-700'}`}>
                    <span className="w-1.5 h-1.5 rounded-full bg-current"></span>
                    {status}
                </span>
            );
        };

        // --- VIEWS ---

        const DashboardView = ({ pos, vendors, inventory }) => {
            const totalSpend = pos.reduce((sum, po) => sum + po.total, 0);
            const pendingApprovalsCount = pos.filter(p => p.status === 'PENDING APPROVAL').length;
            const lowStockCount = inventory.filter(i => i.stock <= i.minStock).length;
            const BUDGET_QUARTER = 200000;
            const budgetUsedPerc = Math.min((totalSpend / BUDGET_QUARTER) * 100, 100).toFixed(1);
            
            const spendByVendorMap = pos.reduce((acc, po) => {
                acc[po.vendorName] = (acc[po.vendorName] || 0) + po.total;
                return acc;
            }, {});
            const barData = Object.keys(spendByVendorMap).map(k => ({ name: k, Spend: spendByVendorMap[k] }));

            const timelineData = [...pos].sort((a,b) => new Date(a.date) - new Date(b.date)).reduce((acc, po) => {
                const existing = acc.find(x => x.date === po.date);
                if(existing) existing.amount += po.total;
                else acc.push({ date: po.date, amount: po.total });
                return acc;
            }, []);

            return (
                <div className="fade-in space-y-6">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Executive Procurement Dashboard</h2>
                            <p className="text-sm text-slate-500 mt-0.5">Real-time spend intelligence, stock thresholds, and manager workflows.</p>
                        </div>
                        {(pendingApprovalsCount > 0 || lowStockCount > 0) && (
                            <div className="flex gap-2">
                                {pendingApprovalsCount > 0 && (
                                    <span className="bg-amber-100 text-amber-800 text-xs font-semibold px-3 py-1.5 rounded-xl border border-amber-200 flex items-center gap-2">
                                        <i className="fa-solid fa-triangle-exclamation"></i> {pendingApprovalsCount} POs Pending Approval
                                    </span>
                                )}
                                {lowStockCount > 0 && (
                                    <span className="bg-rose-100 text-rose-800 text-xs font-semibold px-3 py-1.5 rounded-xl border border-rose-200 flex items-center gap-2">
                                        <i className="fa-solid fa-box-archive"></i> {lowStockCount} Low Stock Alerts
                                    </span>
                                )}
                            </div>
                        )}
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-5">
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs hover:shadow-md transition">
                            <div className="flex items-center justify-between mb-2">
                                <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total PO Spend</span>
                                <div className="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center"><i className="fa-solid fa-dollar-sign"></i></div>
                            </div>
                            <p className="text-2xl font-bold text-slate-900">${totalSpend.toLocaleString()}</p>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs hover:shadow-md transition">
                            <div className="flex items-center justify-between mb-2">
                                <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Budget Utilization</span>
                                <div className="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center"><i className="fa-solid fa-chart-pie"></i></div>
                            </div>
                            <p className="text-2xl font-bold text-slate-900">{budgetUsedPerc}%</p>
                            <div className="w-full bg-slate-100 rounded-full h-1.5 mt-2">
                                <div className={`h-1.5 rounded-full ${budgetUsedPerc > 90 ? 'bg-rose-500' : 'bg-emerald-500'}`} style={{width: `${budgetUsedPerc}%`}}></div>
                            </div>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs hover:shadow-md transition">
                            <div className="flex items-center justify-between mb-2">
                                <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Active Vendors</span>
                                <div className="w-8 h-8 rounded-xl bg-violet-50 text-violet-600 flex items-center justify-center"><i className="fa-solid fa-users"></i></div>
                            </div>
                            <p className="text-2xl font-bold text-slate-900">{vendors.length}</p>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs hover:shadow-md transition">
                            <div className="flex items-center justify-between mb-2">
                                <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Inventory SKUs</span>
                                <div className="w-8 h-8 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center"><i className="fa-solid fa-boxes-stacked"></i></div>
                            </div>
                            <p className="text-2xl font-bold text-slate-900">{inventory.length}</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
                            <h3 className="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2"><i className="fa-solid fa-arrow-trend-up text-indigo-500"></i> Spend Timeline</h3>
                            <div className="h-64">
                                <ResponsiveContainer width="100%" height="100%">
                                    <LineChart data={timelineData}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                        <XAxis dataKey="date" axisLine={false} tickLine={false} tick={{fontSize: 12, fill: '#64748b'}} />
                                        <YAxis axisLine={false} tickLine={false} tickFormatter={(v) => `$${v}`} tick={{fontSize: 12, fill: '#64748b'}} />
                                        <Tooltip formatter={(v) => [`$${v.toLocaleString()}`, 'Spend']} contentStyle={{borderRadius: '12px', border: 'none', boxShadow: '0 10px 15px -3px rgb(0 0 0 / 0.1)'}} />
                                        <Line type="monotone" dataKey="amount" stroke="#6366f1" strokeWidth={3} dot={{r: 4, fill: '#6366f1'}} />
                                    </LineChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
                            <h3 className="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2"><i className="fa-solid fa-chart-column text-emerald-500"></i> Spend by Vendor</h3>
                            <div className="h-64">
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={barData}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                        <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fontSize: 12, fill: '#64748b'}} />
                                        <YAxis axisLine={false} tickLine={false} tickFormatter={(v) => `$${v}`} tick={{fontSize: 12, fill: '#64748b'}} />
                                        <Tooltip cursor={{fill: '#f8fafc'}} formatter={(v) => [`$${v.toLocaleString()}`, 'Spend']} contentStyle={{borderRadius: '12px', border: 'none', boxShadow: '0 10px 15px -3px rgb(0 0 0 / 0.1)'}} />
                                        <Bar dataKey="Spend" fill="#10b981" radius={[6, 6, 0, 0]} />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const InventoryView = ({ inventory, setInventory, setPOs, pos, vendors }) => {
            const { addToast } = useToast();
            const [searchTerm, setSearchTerm] = useState("");

            const handleReorder = (item) => {
                const deficit = (item.minStock * 2) - item.stock;
                const defaultVendor = vendors[0];
                const newPO = {
                    id: generateId('PO'),
                    vendorId: defaultVendor.id,
                    vendorName: defaultVendor.name,
                    itemName: item.name,
                    qty: deficit > 0 ? deficit : 10,
                    receivedQty: 0,
                    price: 150,
                    total: (deficit > 0 ? deficit : 10) * 150,
                    status: 'PENDING APPROVAL',
                    paymentStatus: 'UNPAID',
                    date: new Date().toISOString().split('T')[0]
                };
                setPOs([newPO, ...pos]);
                addToast(`Auto-generated reorder PO for ${item.name}!`, 'success');
            };

            const filtered = inventory.filter(i => i.name.toLowerCase().includes(searchTerm.toLowerCase()) || i.sku.toLowerCase().includes(searchTerm.toLowerCase()));

            return (
                <div className="fade-in space-y-6">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Inventory Stock Levels & Reorders</h2>
                            <p className="text-sm text-slate-500 mt-0.5">Track warehouse stock thresholds and trigger automated replenishment orders.</p>
                        </div>
                        <button onClick={() => exportCSV(inventory, 'inventory_stock.csv')} className="px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm font-medium text-slate-700 hover:bg-slate-50 shadow-xs transition flex items-center gap-2">
                            <i className="fa-solid fa-download text-slate-400"></i> Export CSV
                        </button>
                    </div>

                    <div className="bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden">
                        <div className="p-4 border-b border-slate-100 bg-slate-50 flex items-center justify-between">
                            <div className="relative w-80">
                                <i className="fa-solid fa-search absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                                <input type="text" placeholder="Search SKU or item..." className="pl-10 pr-4 py-2 w-full border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                            </div>
                            <span className="text-xs text-slate-500 font-medium">Showing {filtered.length} items</span>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm text-slate-600">
                                <thead className="bg-slate-50 text-slate-700 border-b border-slate-200 text-xs uppercase tracking-wider">
                                    <tr>
                                        <th className="p-4">SKU</th>
                                        <th className="p-4">Item Name</th>
                                        <th className="p-4">Warehouse</th>
                                        <th className="p-4">Current Stock</th>
                                        <th className="p-4">Min Threshold</th>
                                        <th className="p-4">Status</th>
                                        <th className="p-4 text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filtered.map(i => {
                                        const isLow = i.stock <= i.minStock;
                                        return (
                                            <tr key={i.id} className="border-b border-slate-100 hover:bg-slate-50 transition">
                                                <td className="p-4 font-mono text-xs text-slate-500">{i.sku}</td>
                                                <td className="p-4 font-bold text-slate-900">{i.name}</td>
                                                <td className="p-4 text-slate-600">{i.warehouse}</td>
                                                <td className="p-4 font-semibold text-slate-800">{i.stock} units</td>
                                                <td className="p-4 text-slate-500">{i.minStock} units</td>
                                                <td className="p-4">
                                                    {isLow ? (
                                                        <span className="px-2.5 py-1 text-xs font-bold rounded-lg bg-rose-50 text-rose-700 border border-rose-200 inline-flex items-center gap-1.5">
                                                            <i className="fa-solid fa-triangle-exclamation"></i> Low Stock
                                                        </span>
                                                    ) : (
                                                        <span className="px-2.5 py-1 text-xs font-bold rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200 inline-flex items-center gap-1.5">
                                                            <i className="fa-solid fa-check"></i> Healthy
                                                        </span>
                                                    )}
                                                </td>
                                                <td className="p-4 text-right">
                                                    <button onClick={() => handleReorder(i)} className="px-3 py-1.5 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-xl text-xs font-semibold hover:bg-indigo-100 transition shadow-xs">
                                                        <i className="fa-solid fa-cart-plus mr-1"></i> Quick Reorder
                                                    </button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const POsView = ({ pos, setPOs, vendors, catalog, setVendors, inventory, setInventory }) => {
            const { addToast } = useToast();
            const [searchTerm, setSearchTerm] = useState("");
            const [statusFilter, setStatusFilter] = useState("ALL");
            const [createModal, setCreateModal] = useState(false);
            const [receivePO, setReceivePO] = useState(null); 
            const [ratePO, setRatePO] = useState(null); // Vendor rating modal state
            const [ratingData, setRatingData] = useState({ quality: 5, delivery: 5, cost: 5 });

            const filteredPOs = pos.filter(p => {
                const matchesSearch = p.id.toLowerCase().includes(searchTerm.toLowerCase()) || p.vendorName.toLowerCase().includes(searchTerm.toLowerCase()) || p.itemName.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesStatus = statusFilter === 'ALL' || p.status === statusFilter;
                return matchesSearch && matchesStatus;
            });

            const handleCreatePO = (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const vendorId = fd.get('vendorId');
                const vendor = vendors.find(v => v.id === vendorId);
                const itemName = fd.get('itemName');
                const qty = parseInt(fd.get('qty'));
                const price = parseFloat(fd.get('price'));
                const total = qty * price;
                
                // If total > 5000, requires approval manager sign-off
                const initialStatus = total > 5000 ? 'PENDING APPROVAL' : 'ISSUED';

                const newPO = {
                    id: generateId('PO'),
                    vendorId: vendor.id, 
                    vendorName: vendor.name,
                    itemName, 
                    qty, 
                    receivedQty: 0, 
                    price, 
                    total,
                    status: initialStatus, 
                    paymentStatus: 'UNPAID',
                    date: new Date().toISOString().split('T')[0]
                };
                setPOs([newPO, ...pos]);
                setCreateModal(false);
                addToast(`PO ${newPO.id} successfully created! ${initialStatus === 'PENDING APPROVAL' ? '(Requires Approval)' : ''}`, 'success');
            };

            const handleApprovePO = (poId) => {
                setPOs(pos.map(p => p.id === poId ? { ...p, status: 'ISSUED' } : p));
                addToast(`PO ${poId} approved and issued to vendor!`, 'success');
            };

            const handleReceive = (e) => {
                e.preventDefault();
                const amount = parseInt(new FormData(e.target).get('amount'));
                
                setPOs(pos.map(p => {
                    if(p.id !== receivePO.id) return p;
                    const newReceived = p.receivedQty + amount;
                    const newStatus = newReceived >= p.qty ? 'FULFILLED' : 'PARTIAL RECEIPT';
                    return { ...p, receivedQty: newReceived, status: newStatus };
                }));

                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm text-slate-600 whitespace-nowrap">

                                    <tr>
                                        <th className="p-4">PO # & Date</th>
                                        <th className="p-4">Vendor</th>
                                        <th className="p-4">Item</th>
                                        <th className="p-4">Qty Progress</th>
                                        <th className="p-4">Total Amount</th>
                                        <th className="p-4">Status</th>

                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Quantity Receiving Now</label>

                                </div>

                                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Product Quality (1-5)</label>
                                    <select value={ratingData.quality} onChange={(e)=>setRatingData({...ratingData, quality: e.target.value})} className="w-full border border-slate-200 rounded-xl p-3 bg-white text-sm">
                                        <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                                        <option value="4">⭐⭐⭐⭐ Good</option>
                                        <option value="3">⭐⭐⭐ Average</option>
                                        <option value="2">⭐⭐ Below Average</option>
                                        <option value="1">⭐ Poor</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Delivery Timeliness (1-5)</label>
                                    <select value={ratingData.delivery} onChange={(e)=>setRatingData({...ratingData, delivery: e.target.value})} className="w-full border border-slate-200 rounded-xl p-3 bg-white text-sm">
                                        <option value="5">⭐⭐⭐⭐⭐ On Time / Early</option>
                                        <option value="4">⭐⭐⭐⭐ Minor Delay</option>
                                        <option value="3">⭐⭐⭐ Noticeable Delay</option>
                                        <option value="2">⭐⭐ Significant Delay</option>
                                        <option value="1">⭐ Unacceptable Delay</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Pricing & Invoicing Accuracy (1-5)</label>
                                    <select value={ratingData.cost} onChange={(e)=>setRatingData({...ratingData, cost: e.target.value})} className="w-full border border-slate-200 rounded-xl p-3 bg-white text-sm">
                                        <option value="5">⭐⭐⭐⭐⭐ Exact match / Great terms</option>
                                        <option value="4">⭐⭐⭐⭐ Minor discrepancy resolved</option>
                                        <option value="3">⭐⭐⭐ Average</option>
                                        <option value="2">⭐⭐ Billing errors</option>
                                        <option value="1">⭐ Severe overcharging / Disputed</option>
                                    </select>

                                <button type="submit" className="w-full bg-emerald-600 text-white py-3 rounded-xl font-semibold hover:bg-emerald-700 transition shadow-sm mt-2">Submit Scorecard & Update Vendor</button>
                            </form>
                        )}
                    </Modal>

        };

        const SourcingView = ({ bids, setBids, pos, setPOs }) => {
            const { addToast } = useToast();
            
            const groupedBids = useMemo(() => {
                return bids.reduce((acc, bid) => {
                    if (!acc[bid.itemName]) acc[bid.itemName] = [];
                    acc[bid.itemName].push(bid);
                    return acc;
                }, {});
            }, [bids]);

            const handleAward = (awardedBid) => {
                const updatedBids = bids.map(b => b.id === awardedBid.id ? { ...b, status: 'AWARDED' } : b);
                setBids(updatedBids);

                const newPO = {
                    id: generateId('PO'),
                    vendorId: awardedBid.vendorId,
                    vendorName: awardedBid.vendorName,
                    itemName: awardedBid.itemName,
                    qty: 10,
                    receivedQty: 0,
                    price: awardedBid.amount,
                    total: awardedBid.amount * 10,
                    status: 'ISSUED',
                    paymentStatus: 'UNPAID',
                    date: new Date().toISOString().split('T')[0]
                };
                setPOs([newPO, ...pos]);
                addToast(`PO ${newPO.id} generated for winning bidder ${awardedBid.vendorName}!`, 'success');
            };

            return (
                <div className="fade-in space-y-6">

                            <i className="fa-solid fa-rotate text-slate-400"></i> Refresh Bids
                        </button>
                    </div>

                    {Object.entries(groupedBids).map(([item, itemBids]) => {
                        const pendingBids = itemBids.filter(b => b.status === 'PENDING');
                        const minAmount = pendingBids.length > 0 ? Math.min(...pendingBids.map(b => b.amount)) : null;
                        const isAwarded = itemBids.some(b => b.status === 'AWARDED');

                        return (
                            <div key={item} className="bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden mb-6">

                                    {isAwarded && <StatusBadge status="AWARDED" />}
                                </div>
                                <table className="w-full text-left text-sm text-slate-600">
                                    <thead className="bg-white border-b border-slate-100 text-xs uppercase tracking-wider text-slate-400">

                                            <th className="p-4">Vendor</th>
                                            <th className="p-4">Unit Bid Amount</th>
                                            <th className="p-4">Status</th>
                                            <th className="p-4 text-right">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {itemBids.map(bid => (
                                            <tr key={bid.id} className={`border-b border-slate-100 ${bid.amount === minAmount && !isAwarded ? 'bg-emerald-50/50' : 'hover:bg-slate-50'} transition`}>
                                                <td className="p-4 font-bold text-slate-900">{bid.vendorName}</td>
                                                <td className="p-4 font-bold text-slate-800">
                                                    ${bid.amount.toLocaleString()}
                                                    {bid.amount === minAmount && !isAwarded && <span className="ml-3 text-xs bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full font-bold">Lowest Bid</span>}
                                                </td>
                                                <td className="p-4"><StatusBadge status={bid.status} /></td>
                                                <td className="p-4 text-right">
                                                    {!isAwarded && bid.status === 'PENDING' && (
                                                        <button onClick={() => handleAward(bid)} className="px-3.5 py-1.5 bg-primary text-white text-xs font-semibold rounded-xl hover:bg-indigo-600 transition shadow-xs">
                                                            Award & Generate PO
                                                        </button>
                                                    )}
                                                    {bid.status === 'AWARDED' && (
                                                        <span className="text-slate-400 text-xs italic font-medium">Awarded Winner</span>
                                                    )}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )
                    })}
                </div>
            );
        };

        const VendorsView = ({ vendors, setVendors }) => {
            const { addToast } = useToast();
            const [searchTerm, setSearchTerm] = useState("");
            const [isModalOpen, setIsModalOpen] = useState(false);
            
            const handleAddVendor = (e) => {

                const fd = new FormData(e.target);
                const newVendor = {

                    category: fd.get('category'),
                    contact: fd.get('contact'),

                                <i className="fa-solid fa-download text-slate-400"></i> Export CSV

                                </select>
                            </div>
                            <button type="submit" className="w-full bg-primary text-white py-3 rounded-xl font-semibold hover:bg-indigo-600 transition shadow-sm mt-2">Save Vendor</button>
                        </form>
                    </Modal>
                </div>
            );
        };

        const CatalogView = ({ catalog, setCatalog }) => {
            const { addToast } = useToast();
            const [searchTerm, setSearchTerm] = useState("");
            const [isModalOpen, setIsModalOpen] = useState(false);

            const handleAdd = (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                setCatalog([...catalog, { id: generateId('c'), sku: fd.get('sku'), name: fd.get('name'), category: fd.get('category'), stdPrice: parseFloat(fd.get('stdPrice')) }]);
                setIsModalOpen(false);
                addToast('Catalog item added successfully!', 'success');
            };

            return (
                <div className="fade-in space-y-6">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Item Master Catalog</h2>
                            <p className="text-sm text-slate-500 mt-0.5">Standardized SKUs and reference pricing for procurement requisitions.</p>
                        </div>
                        <button onClick={() => setIsModalOpen(true)} className="px-4 py-2 bg-primary text-white rounded-xl text-sm font-semibold hover:bg-indigo-600 shadow-sm transition flex items-center gap-2">
                            <i className="fa-solid fa-plus"></i> Add Item
                        </button>
                    </div>

                    <div className="bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden">
                        <div className="p-4 border-b border-slate-100 bg-slate-50">
                            <div className="relative w-80">
                                <i className="fa-solid fa-search absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                                <input type="text" placeholder="Search SKU or name..." className="pl-10 pr-4 py-2 w-full border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                            </div>
                        </div>
                        <table className="w-full text-left text-sm text-slate-600">
                            <thead className="bg-slate-50 text-slate-700 border-b border-slate-200 text-xs uppercase tracking-wider">
                                <tr>
                                    <th className="p-4">SKU Code</th>
                                    <th className="p-4">Item Name</th>
                                    <th className="p-4">Category</th>
                                    <th className="p-4">Standard Price</th>
                                </tr>
                            </thead>
                            <tbody>
                                {catalog.filter(c => c.name.toLowerCase().includes(searchTerm.toLowerCase()) || c.sku.toLowerCase().includes(searchTerm.toLowerCase())).map(c => (
                                    <tr key={c.id} className="border-b border-slate-100 hover:bg-slate-50 transition">
                                        <td className="p-4 font-mono text-xs text-slate-500">{c.sku}</td>
                                        <td className="p-4 font-bold text-slate-900">{c.name}</td>
                                        <td className="p-4 text-slate-600">{c.category}</td>
                                        <td className="p-4 font-semibold text-slate-800">${c.stdPrice.toLocaleString()}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title="Add Master Catalog Item">
                        <form onSubmit={handleAdd} className="space-y-4">
                            <div><label className="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">SKU Code</label><input required name="sku" className="w-full border border-slate-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-primary" placeholder="e.g., HW-ROU-09" /></div>
                            <div><label className="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Item Name</label><input required name="name" className="w-full border border-slate-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-primary" /></div>
                            <div><label className="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Category</label><input required name="category" className="w-full border border-slate-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-primary" /></div>
                            <div><label className="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Standard Price ($)</label><input required type="number" step="0.01" name="stdPrice" className="w-full border border-slate-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-primary" /></div>
                            <button type="submit" className="w-full bg-primary text-white py-3 rounded-xl font-semibold hover:bg-indigo-600 transition shadow-sm mt-2">Save Catalog Item</button>
                        </form>
                    </Modal>
                </div>
            );
        };

        // --- MAIN APP LAYOUT ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [vendors, setVendors] = useLocalStorage('procurify_vendors', seedVendors);
            const [catalog, setCatalog] = useLocalStorage('procurify_catalog', seedCatalog);
            const [inventory, setInventory] = useLocalStorage('procurify_inventory', seedInventory);
            const [pos, setPOs] = useLocalStorage('procurify_pos', seedPOs);
            const [bids, setBids] = useLocalStorage('procurify_bids', seedBids);

            const pendingCount = pos.filter(p => p.status === 'PENDING APPROVAL').length;
            const lowStockCount = inventory.filter(i => i.stock <= i.minStock).length;

            const tabs = [
                { id: 'dashboard', label: 'Intelligence', icon: 'fa-chart-pie' },
                { id: 'pos', label: 'Orders & Receiving', icon: 'fa-file-invoice-dollar', badge: pendingCount },
                { id: 'inventory', label: 'Inventory & Reorders', icon: 'fa-boxes-stacked', badge: lowStockCount },
                { id: 'sourcing', label: 'Sourcing Matrix', icon: 'fa-scale-balanced' },
                { id: 'vendors', label: 'Vendor Directory', icon: 'fa-address-book' },
                { id: 'catalog', label: 'Item Catalog', icon: 'fa-box-open' }
            ];

            return (
                <div className="flex h-screen overflow-hidden bg-slate-100">
                    {/* Modern Sidebar */}
                    <aside className="w-72 bg-secondary text-slate-300 flex flex-col shadow-2xl z-20">
                        <div className="p-6 flex items-center gap-3 text-white font-bold text-xl tracking-tight border-b border-slate-800">
                            <div className="w-9 h-9 bg-primary rounded-xl flex items-center justify-center shadow-lg shadow-primary/30">
                                <i className="fa-solid fa-cube text-white text-sm"></i>
                            </div>
                            Procurify <span className="text-xs bg-indigo-500/20 text-indigo-400 px-2 py-0.5 rounded-md font-mono">OS</span>
                        </div>
                        <nav className="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto">
                            {tabs.map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                                    className={`w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-semibold transition-all ${activeTab === tab.id ? 'bg-primary text-white shadow-lg shadow-primary/25' : 'hover:bg-slate-800/80 hover:text-white text-slate-400'}`}>
                                    <div className="flex items-center gap-3">
                                        <i className={`fa-solid ${tab.icon} w-5 text-center text-base`}></i>
                                        <span>{tab.label}</span>
                                    </div>
                                    {tab.badge > 0 && (
                                        <span className={`text-xs px-2 py-0.5 rounded-full font-bold ${activeTab === tab.id ? 'bg-white text-primary' : 'bg-rose-500 text-white'}`}>
                                            {tab.badge}
                                        </span>
                                    )}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-slate-800 text-xs text-slate-500 flex items-center justify-between">
                            <span>Enterprise Edition</span>
                            <span className="font-mono text-emerald-400">● Live</span>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col h-screen overflow-hidden">
                        <header className="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-8 shadow-xs z-10">
                            <div className="flex items-center gap-2 text-sm text-slate-400 font-medium">
                                Workspace <i className="fa-solid fa-chevron-right text-xs text-slate-300"></i> 
                                <span className="font-bold text-slate-800 capitalize">{activeTab.replace('-', ' ')}</span>
                            </div>
                            <div className="flex items-center gap-4">
                                <button className="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 transition relative">
                                    <i className="fa-regular fa-bell"></i>
                                    {(pendingCount > 0 || lowStockCount > 0) && <span className="absolute top-2 right-2 w-2 h-2 bg-rose-500 rounded-full"></span>}
                                </button>
                                <div className="flex items-center gap-3 pl-2 border-l border-slate-200">
                                    <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 text-white font-bold text-sm flex items-center justify-center shadow-md shadow-indigo-500/20">
                                        JD
                                    </div>
                                    <div className="hidden md:block text-left">
                                        <p className="text-sm font-bold text-slate-800 leading-tight">Jane Doe</p>
                        <p className="text-xs text-slate-400 leading-tight mt-0.5">Supply Chain Lead</p>
                                    </div>
                                </div>
                            </div>
                        </header>
                        <div className="flex-1 overflow-y-auto p-8">
                            {activeTab === 'dashboard' && <DashboardView pos={pos} vendors={vendors} inventory={inventory} />}
                            {activeTab === 'pos' && <POsView pos={pos} setPOs={setPOs} vendors={vendors} catalog={catalog} setVendors={setVendors} inventory={inventory} setInventory={setInventory} />}
                            {activeTab === 'inventory' && <InventoryView inventory={inventory} setInventory={setInventory} setPOs={setPOs} pos={pos} vendors={vendors} />}
                            {activeTab === 'sourcing' && <SourcingView bids={bids} setBids={setBids} pos={pos} setPOs={setPOs} />}
                            {activeTab === 'vendors' && <VendorsView vendors={vendors} setVendors={setVendors} />}
                            {activeTab === 'catalog' && <CatalogView catalog={catalog} setCatalog={setCatalog} />}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ToastProvider><App /></ToastProvider>);
    </script>
</body>
</html>
